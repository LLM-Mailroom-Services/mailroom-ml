<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="640" height="680" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">Mailroom ML</title><desc id="desc">Clerk-normalized document windows pass through one shared encoder, document-type and subclass heads, and a calibrated gate. Accepted documents take the CPU fast path; uncertain documents go to the LLM sorter.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="640" height="680" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="639" height="679" rx="24" fill="none" stroke="#334155"/>
<text x="320" y="54" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">THE MAILROOM CONSTELLATION</text>
<text x="320" y="116" font-size="42" fill="url(#heading)" font-weight="800" text-anchor="middle">Mailroom ML</text>
<text x="320" y="157" font-size="22" fill="#cbd5e1" font-weight="400" text-anchor="middle">A calibrated first pass.</text>
<text x="320" y="186" font-size="22" fill="#cbd5e1" font-weight="400" text-anchor="middle">A clear path for uncertain documents.</text>
<rect x="24" y="248" width="286" height="110" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-opacity=".65"/><rect x="40" y="266" width="5" height="74" rx="2" fill="#38bdf8"/><text x="58" y="284" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Windows</text><text x="58" y="311" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">normalized inputs</text>
<rect x="330" y="248" width="286" height="110" rx="14" fill="#111a2e" stroke="#c084fc" stroke-opacity=".65"/><rect x="346" y="266" width="5" height="74" rx="2" fill="#c084fc"/><text x="364" y="284" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Encoder</text><text x="364" y="311" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">shared ModernBERT</text>
<rect x="24" y="394" width="286" height="110" rx="14" fill="#111a2e" stroke="#f472b6" stroke-opacity=".65"/><rect x="40" y="412" width="5" height="74" rx="2" fill="#f472b6"/><text x="58" y="430" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Heads</text><text x="58" y="457" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">type + subclasses</text>
<rect x="330" y="394" width="286" height="110" rx="14" fill="#111a2e" stroke="#22c55e" stroke-opacity=".65"/><rect x="346" y="412" width="5" height="74" rx="2" fill="#22c55e"/><text x="364" y="430" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Gate</text><text x="364" y="457" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">calibration + OOD</text>
<path d="M310 303 L326 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M473 363 V378 H167 V388" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310 449 L326 449" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="575" font-size="22" fill="#7dd3fc" font-weight="600" text-anchor="middle">Accepted → CPU fast path</text>
<text x="320" y="610" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">Uncertain → LLM sorter</text>
</svg>
