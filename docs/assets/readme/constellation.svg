<text x="96" y="298" font-size="12" fill="#64748b">testing harness</text>
<rect x="420" y="230" width="240" height="84" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
<text x="436" y="260" font-size="16" fill="#e2e8f0" font-weight="700">llm-mailroom</text>
