<rect x="640" y="70" width="230" height="84" rx="14" fill="#14213d" stroke="#f472b6" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="656" y="100" font-size="16" fill="#e2e8f0" font-weight="700">mailroom-ml</text>
