[project]
name = "mailroom-ml"
version = "0.1.0"
description = "Dedicated ML training, evaluation, and fine-tuning environment for the Digital Mailroom: ModernBERT ingest fast-path classifier, data lineage, calibration, and routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lucius Morningstar" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
    "datasets>=2.19",
    "requests>=2.31",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.48",
    "accelerate>=1.0",
    "evaluate>=0.4",
    "scipy>=1.11",
]
serve = [
    "onnxruntime>=1.18",
    "optimum>=1.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Deploy-time only — never part of the runtime venv (tests stub/importorskip it).
deploy = [
    "modal==1.5.5",  # pinned: verified against docs 2026-09-18 (releases page)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "train: requires the train extra (torch/transformers)",
    "serve: requires the serve extra (onnxruntime/optimum)",
    "fullcorpus: requires the local HF snapshot under data/",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]