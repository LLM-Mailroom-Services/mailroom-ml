<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">Mailroom ML</title><desc id="desc">Clerk-normalized document windows pass through one shared encoder, document-type and subclass heads, and a calibrated gate. Accepted documents take the CPU fast path; uncertain documents go to the LLM sorter.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="479" rx="24" fill="none" stroke="#334155"/>
<text x="600" y="54" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">THE MAILROOM CONSTELLATION</text>
<text x="600" y="132" font-size="64" fill="url(#heading)" font-weight="800" text-anchor="middle">Mailroom ML</text>
<text x="600" y="181" font-size="23" fill="#cbd5e1" font-weight="400" text-anchor="middle">A calibrated first pass. A clear path for uncertain documents.</text>
<text x="600" y="220" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="middle">MODERNBERT · CONDITIONAL HEADS · CPU INFERENCE</text>
<rect x="48" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-opacity=".65"/><rect x="64" y="278" width="5" height="50" rx="2" fill="#38bdf8"/><text x="82" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Document windows</text><text x="82" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">clerk-normalized inputs</text>
<path d="M306 303 L327 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M306 303 L327 303" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="330" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#c084fc" stroke-opacity=".65"/><rect x="346" y="278" width="5" height="50" rx="2" fill="#c084fc"/><text x="364" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Shared encoder</text><text x="364" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">ModernBERT backbone</text>
<path d="M588 303 L609 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M588 303 L609 303" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="612" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#f472b6" stroke-opacity=".65"/><rect x="628" y="278" width="5" height="50" rx="2" fill="#f472b6"/><text x="646" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Conditional heads</text><text x="646" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">doc type + subclasses</text>
<path d="M870 303 L891 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M870 303 L891 303" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="894" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#22c55e" stroke-opacity=".65"/><rect x="910" y="278" width="5" height="50" rx="2" fill="#22c55e"/><text x="928" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Routing gate</text><text x="928" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">calibration + OOD</text>
<text x="600" y="462" font-size="16" fill="#94a3b8" font-weight="400" text-anchor="middle">calibrated gate</text><text x="326" y="425" font-size="19" fill="#7dd3fc" font-weight="600" text-anchor="middle">CPU fast path when accepted</text><text x="874" y="425" font-size="19" fill="#facc15" font-weight="600" text-anchor="middle">LLM fallback when uncertain</text><path d="M1023 346 V366 H600 V393 H326 M600 393 H874" fill="none" stroke="#64748b" stroke-width="1.5"/>
</svg>
