<text x="736" y="286" font-size="15" fill="#e2e8f0" font-weight="700">Langfuse</text>
<text x="736" y="310" font-size="12" fill="#94a3b8">external · trace store</text>
</g>
<g data-node="viz"><rect x="950" y="252" width="210" height="96" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
<text x="966" y="286" font-size="15" fill="#e2e8f0" font-weight="700">The-Mailroom</text>
