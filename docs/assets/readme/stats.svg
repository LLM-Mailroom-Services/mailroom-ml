<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">Mailroom ML at a glance</title><desc id="desc">1 encoder — 6 conditional heads — observed-GT vocabularies; 8,192 — tokens per window — 512-token overlap; CPU ONNX — fp32 preferred — bundle-based inference; LLM fallback — uncertain documents — calibrated routing gate</desc>
