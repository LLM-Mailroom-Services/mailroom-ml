# One-shot held-out-plus eval on exios66 Modal (L4). Manual only — ~$0.16 GPU.
# Secrets: MODAL_TOKEN_ID + MODAL_TOKEN_SECRET required; HF_TOKEN optional (public Hub).
name: heldout-plus-modal-eval

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: M9a run tag (Arm B primary)
        required: true
        default: m9a-local-20260927-014429
      module:
        description: Checkpoint path under modernbert-checkpoints volume
        required: true
        default: latest
      skip_deploy:
        description: Skip modal deploy (image already has current plus bake)
        required: true
        type: boolean
        default: false
      push_results:
        description: Commit artifacts to branch heldout-plus-eval/<run_tag>
        required: true
        type: boolean
        default: true

jobs:
  modal-heldout-plus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync deploy extras
        run: uv sync --extra dev --extra deploy

      - name: Run heldout-plus eval (one deploy + one L4 job)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RUN_TAG: ${{ inputs.run_tag }}
          MODULE: ${{ inputs.module }}
          SKIP_DEPLOY: ${{ inputs.skip_deploy && '1' || '0' }}
        run: ./training/run_heldout_plus_modal_eval.sh

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-plus-eval-${{ inputs.run_tag }}
          path: |
            reports/eval_*-heldout-plus.json
            reports/TEST-EVAL/TEST-EVAL-REPORT-heldout-plus-*.md
            reports/TEST-EVAL/TEST-EVAL-COMPARE-323-vs-1323-*.md
            reports/TEST-EVAL/eval_*-heldout-plus.json
            reports/TEST-EVAL/MANIFEST.json

      - name: Push eval artifacts to repo branch
        if: success() && inputs.push_results
        env:
          RUN_TAG: ${{ inputs.run_tag }}
        run: |
          set -euo pipefail
          eval_json="reports/eval_${RUN_TAG}-heldout-plus.json"
          uv run python - <<PY
          import json, sys
          from pathlib import Path
          p = Path("${eval_json}")
          r = json.loads(p.read_text())
          if r.get("eval_subset") != "heldout-plus":
              sys.exit(f"eval_subset mismatch: {r.get('eval_subset')}")
          if r.get("n_docs") != 1323:
              sys.exit(f"expected n_docs=1323 got {r.get('n_docs')}")
          print("artifact gate OK", flush=True)
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "heldout-plus-eval/${RUN_TAG}"
          git add reports/eval_${RUN_TAG}-heldout-plus.json reports/TEST-EVAL/
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "#112 heldout-plus Modal eval (${RUN_TAG}, n_docs=1323)"
          git push origin "HEAD:heldout-plus-eval/${RUN_TAG}"
