<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1218" width="640" height="1218" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">From raw text to a routing decision</title>
  <desc id="d">Inputs are clerk-normalized, windowed, encoded by ModernBERT, scored by six heads, calibrated and gated; around the model sit training, evaluation, ONNX export, serving and enrichment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
  <rect width="640" height="1218" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="639" height="1217" rx="24" fill="none" stroke="#1f2a44"/>

<text x="24" y="40" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="2">FROM RAW TEXT TO A ROUTING DECISION</text>
<path id="chain" d="M320 111.0 V651.0" fill="none"/>
<rect x="24" y="70" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="86" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="104" font-size="18" fill="#e2e8f0" font-weight="700">Normalize</text><text x="54" y="126" font-size="14" fill="#94a3b8">clerk-normalized</text><text x="54" y="144" font-size="12" fill="#64748b">leak-free inputs</text>
<path d="M320 155 L320 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="178" width="592" height="82" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="194" width="5" height="50" rx="2" fill="#22c55e"/><text x="54" y="212" font-size="18" fill="#e2e8f0" font-weight="700">Window</text><text x="54" y="234" font-size="14" fill="#94a3b8">8,192 tokens</text><text x="54" y="252" font-size="12" fill="#64748b">512 overlap</text>
<path d="M320 263 L320 283" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="286" width="592" height="82" rx="14" fill="#0f172a" stroke="#a3e635" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="302" width="5" height="50" rx="2" fill="#a3e635"/><text x="54" y="320" font-size="18" fill="#e2e8f0" font-weight="700">Encode</text><text x="54" y="342" font-size="14" fill="#94a3b8">ModernBERT</text><text x="54" y="360" font-size="12" fill="#64748b">shared by all heads</text>
<path d="M320 371 L320 391" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="394" width="592" height="82" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="410" width="5" height="50" rx="2" fill="#a78bfa"/><text x="54" y="428" font-size="18" fill="#e2e8f0" font-weight="700">Heads</text><text x="54" y="450" font-size="14" fill="#94a3b8">doc_type + 5 subclass</text><text x="54" y="468" font-size="12" fill="#64748b">plurality merge</text>
<path d="M320 479 L320 499" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="502" width="592" height="82" rx="14" fill="#0f172a" stroke="#fb923c" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="518" width="5" height="50" rx="2" fill="#fb923c"/><text x="54" y="536" font-size="18" fill="#e2e8f0" font-weight="700">Calibrate</text><text x="54" y="558" font-size="14" fill="#94a3b8">temperature per head</text><text x="54" y="576" font-size="12" fill="#64748b">+ OOD energy probe</text>
<path d="M320 587 L320 607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="610" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="626" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="644" font-size="18" fill="#e2e8f0" font-weight="700">Gate</text><text x="54" y="666" font-size="14" fill="#94a3b8">p · agreement · margin</text><text x="54" y="684" font-size="12" fill="#64748b">fast path or LLM</text>
<circle class="motion" r="5" fill="#7dd3fc" filter="url(#soft)"><animateMotion dur="5.4s" begin="0s" repeatCount="indefinite"><mpath href="#chain"/></animateMotion></circle>
<text x="24" y="732" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="2">AROUND THE MODEL</text>
<g opacity=".92"><rect x="24" y="748" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="764" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="782" font-size="17" fill="#e2e8f0" font-weight="700">Train</text><text x="54" y="804" font-size="14" fill="#94a3b8">local or Modal GPU</text><text x="54" y="822" font-size="12" fill="#64748b">operator-budgeted</text></g>
<g opacity=".92"><rect x="24" y="838" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="854" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="872" font-size="17" fill="#e2e8f0" font-weight="700">Evaluate</text><text x="54" y="894" font-size="14" fill="#94a3b8">held-out test + ECE</text><text x="54" y="912" font-size="12" fill="#64748b">paired bootstrap compare</text></g>
<g opacity=".92"><rect x="24" y="928" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="944" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="962" font-size="17" fill="#e2e8f0" font-weight="700">Export</text><text x="54" y="984" font-size="14" fill="#94a3b8">ONNX + parity check</text><text x="54" y="1002" font-size="12" fill="#64748b">fp32 preferred</text></g>
<g opacity=".92"><rect x="24" y="1018" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="1034" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="1052" font-size="17" fill="#e2e8f0" font-weight="700">Serve</text><text x="54" y="1074" font-size="14" fill="#94a3b8">CPU ONNX</text><text x="54" y="1092" font-size="12" fill="#64748b">Modal app is a fallback</text></g>
<g opacity=".92"><rect x="24" y="1108" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="1124" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="1142" font-size="17" fill="#e2e8f0" font-weight="700">Enrich</text><text x="54" y="1164" font-size="14" fill="#94a3b8">tiered augmentation</text><text x="54" y="1182" font-size="12" fill="#64748b">Tier 1 → Tier 3 gates</text></g>
</svg>
