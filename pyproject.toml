[project]
name = "mailroom-ml"
version = "0.1.0"
description = "Dedicated ML training, evaluation, and fine-tuning environment for the Digital Mailroom: ModernBERT ingest fast-path classifier, data lineage, calibration, and routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lucius Morningstar" }]
dependencies = [
    "pandas>=3.0.6",
    "numpy>=2.2",  # 2.4.x still installs on Python 3.11; 3.12+ resolves 2.5
    "pyarrow>=25.0",
    "pyyaml>=6.0.3",
    # datasets 5.0.1 requires huggingface-hub<2; 2.x is not installable with this stack
    "huggingface_hub>=1.33,<2",
    "datasets>=5.0.1",
]

[project.optional-dependencies]
train = [
    "torch>=2.14",
    "transformers>=5.18",
    "accelerate>=1.15",
    "evaluate>=0.4.6",
    "scipy>=1.17",  # 1.18 needs Python 3.12; 3.11 resolves 1.17
]
serve = [
    "onnxruntime>=1.30",
    "optimum>=2.3",
    "fastapi[standard]>=0.142",  # deploy/serve_app.py (Modal web endpoints)
    "tokenizers>=0.23.1,<0.24",  # ONNX path; matches transformers 5.18
    "onnx>=1.19",  # torch 2.14 exporter
    "onnxscript>=0.7",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]
# Deploy-time only — never part of the runtime venv (tests stub/importorskip it).
deploy = [
    "modal==1.6.0",  # pinned: verified against docs 2026-10-02 (releases page)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "train: requires the train extra (torch/transformers)",
    "serve: requires the serve extra (onnxruntime/optimum/tokenizers)",
    "deploy: requires the deploy extra (modal)",
    "fullcorpus: requires the local HF snapshot under data/",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.sh"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
