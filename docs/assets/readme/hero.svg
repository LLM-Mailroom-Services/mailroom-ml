<text x="600" y="44" font-size="13" fill="#8b9bb4" font-weight="700" text-anchor="middle" letter-spacing="3">THE MAILROOM CONSTELLATION · THE FAST PATH</text><ellipse cx="600" cy="116" rx="420" ry="70" fill="url(#glow)" opacity=".18"/><text x="600" y="126" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#ttl)">Mailroom ML</text><text x="600" y="170" font-size="20" fill="#cbd5e1" text-anchor="middle">A fast, calibrated first look at every document — and a polite handoff to the LLM when it is not sure.</text><text x="600" y="202" font-size="13" fill="#8b9bb4" font-weight="600" text-anchor="middle" letter-spacing="3">MODERNBERT · ONE ENCODER · SIX HEADS · CALIBRATED GATE · CPU ONNX</text><text x="80" y="246" font-size="11" fill="#8b9bb4" font-weight="700" letter-spacing="2">ONE DOCUMENT</text>
