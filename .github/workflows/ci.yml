name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src training tests deploy

      - name: Pytest (not fullcorpus)
        run: uv run pytest -m "not fullcorpus" --strict-markers
