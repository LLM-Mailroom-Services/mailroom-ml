<g font-size="12" fill="#94a3b8" font-style="italic"><text x="276" y="100">publishes</text><text x="262" y="192">pinned pull</text><text x="530" y="188">pinned pull</text><text x="574" y="100">trains on</text><text x="700" y="186">optional fast path</text><text x="340" y="262">executes</text><text x="128" y="356">scores with</text><text x="520" y="358">scores with</text><text x="666" y="276">traces</text><text x="898" y="262">feeds</text></g>
