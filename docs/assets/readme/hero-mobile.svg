<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">Mailroom ML</title>
  <desc id="d">Animated banner: a document is cut into overlapping 8,192-token windows, encoded by ModernBERT, classified by a document-type head and subclass heads, then a calibrated gate sends it down the CPU fast path or hands it to the LLM sorter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="env"><rect x="-22" y="-30" width="44" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><polyline points="-22,-30 0,-13 22,-30" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-13" r="3.2" fill="#ef4444"/></g>
  </defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
  <rect width="640" height="560" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="639" height="559" rx="24" fill="none" stroke="#1f2a44"/>
  <g fill="#e0e7ff"><circle cx="127" cy="197" r="1.7" opacity=".35"/><circle cx="241" cy="194" r="1.2" opacity=".35"/><circle cx="344" cy="17" r="1.6" opacity=".35"/><circle cx="226" cy="44" r="1.4" opacity=".35"/><circle cx="364" cy="25" r="1.6" opacity=".35"/><circle cx="577" cy="44" r="1.2" opacity=".35"/><circle cx="201" cy="56" r="1.6" opacity=".35"/><circle cx="190" cy="22" r="1.6" opacity=".35"/><circle cx="557" cy="19" r="1" opacity=".35"/><circle cx="591" cy="88" r="1" opacity=".35"/><circle cx="162" cy="47" r="1" opacity=".35"/></g>
  <g class="motion" fill="#e0e7ff"><circle cx="127" cy="197" r="1.7"><animate attributeName="opacity" values="0;.9;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><circle cx="241" cy="194" r="1.2"><animate attributeName="opacity" values="0;.9;0" dur="4.3s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="344" cy="17" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="226" cy="44" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="3.5s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="364" cy="25" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="577" cy="44" r="1.2"><animate attributeName="opacity" values="0;.9;0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="201" cy="56" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle><circle cx="190" cy="22" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="2.7s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="557" cy="19" r="1"><animate attributeName="opacity" values="0;.9;0" dur="2.3s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="591" cy="88" r="1"><animate attributeName="opacity" values="0;.9;0" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="162" cy="47" r="1"><animate attributeName="opacity" values="0;.9;0" dur="3.1s" begin="1.6s" repeatCount="indefinite"/></circle></g>
<text x="320" y="46" font-size="12" fill="#8b9bb4" font-weight="700" text-anchor="middle" letter-spacing="2">THE MAILROOM CONSTELLATION · THE FAST PATH</text><text x="320" y="108" text-anchor="middle" font-size="46" font-weight="800" letter-spacing="-1.5" fill="url(#ttl)">Mailroom ML</text><text x="320" y="148" font-size="18" fill="#cbd5e1" text-anchor="middle">A fast, calibrated first look —</text><text x="320" y="174" font-size="18" fill="#cbd5e1" text-anchor="middle">and a polite handoff to the LLM.</text><rect x="24" y="224" width="292" height="86" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="40" y="242" width="5" height="50" rx="2" fill="#38bdf8"/><text x="58" y="262" font-size="19" fill="#e2e8f0" font-weight="700">Window</text><text x="58" y="286" font-size="14" fill="#94a3b8">8,192 tokens · 512 overlap</text><rect x="324" y="224" width="292" height="86" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity=".7" stroke-width="1.5"/><rect x="340" y="242" width="5" height="50" rx="2" fill="#22c55e"/><text x="358" y="262" font-size="19" fill="#e2e8f0" font-weight="700">Classify</text><text x="358" y="286" font-size="14" fill="#94a3b8">one encoder · six heads</text><rect x="24" y="324" width="292" height="86" rx="14" fill="#0f172a" stroke="#a3e635" stroke-opacity=".7" stroke-width="1.5"/><rect x="40" y="342" width="5" height="50" rx="2" fill="#a3e635"/><text x="58" y="362" font-size="19" fill="#e2e8f0" font-weight="700">Calibrate</text><text x="58" y="386" font-size="14" fill="#94a3b8">temperature + OOD probe</text><rect x="324" y="324" width="292" height="86" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5"/><rect x="340" y="342" width="5" height="50" rx="2" fill="#a78bfa"/><text x="358" y="362" font-size="19" fill="#e2e8f0" font-weight="700">Route</text><text x="358" y="386" font-size="14" fill="#94a3b8">fast path or LLM sorter</text><path d="M40 468 H600" stroke="#334155" stroke-width="10" stroke-linecap="round"/><path d="M40 468 H600" stroke="#64748b" stroke-width="2" stroke-dasharray="10 14"/><path id="mb" d="M40 462 H600" fill="none"/><g class="motion"><use href="#env" transform="scale(.7)" ><animateMotion dur="5s" begin="0.0s" repeatCount="indefinite"><mpath href="#mb"/></animateMotion></use><use href="#env" transform="scale(.7)" ><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#mb"/></animateMotion></use></g><text x="320" y="516" font-size="14" fill="#8b9bb4" text-anchor="middle">the LLM sorter stays the authority for the messy tail</text></svg>
